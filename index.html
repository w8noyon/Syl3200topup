<html lang="bn">
<head>

<meta name="theme-color" content="#0b0d1a">
<title>SYL 3200 TOPUP</title>

<!-- Fonts & Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>

<link rel="stylesheet" href="style.css">
</head>
<body class="select-none">

<!-- ========================================== -->
<!-- এখানে আপনার আগের সব HTML কোড বসবে (body ট্যাগের ভেতরের অংশ) -->
<!-- ========================================== -->

<!-- AUTH SECTION -->
<section id="auth-sec" class="auth-bg flex flex-col items-center justify-center p-5 z-50 fixed inset-0">
  <div class="w-full max-w-sm relative z-10">
    <div class="login-card">
      <div class="login-logo-wrap" id="login-logo-container"></div>
      <div class="login-brand">
        <span class="login-brand-badge" id="auth-brand-badge"><i class="fas fa-bolt"></i> Premium Service</span>
        <h1 id="auth-site-name" class="login-title">SYL 3200 TOPUP</h1>
        <div class="login-title-divider"><span class="ln"></span><span class="dot"></span><span class="ln"></span></div>
      </div>
      <p id="auth-tagline" class="login-sub">Premium Top-Up Service</p>
      <div class="auth-tabs">
        <button type="button" onclick="toggleAuth('login')" id="btn-login-view" class="auth-tab on"><i class="fas fa-right-to-bracket"></i> Login</button>
        <button type="button" onclick="toggleAuth('register')" id="btn-reg-view" class="auth-tab"><i class="fas fa-user-plus"></i> Register</button>
      </div>
      <div id="login-form" class="space-y-3">
        <div class="relative"><input type="email" id="login-email" placeholder="Email Address" class="inp pl-11"><i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i></div>
        <div class="relative"><input type="password" id="login-pass" placeholder="Password" class="inp pl-11 pr-11"><i class="fas fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i><button type="button" onclick="togglePass('login-pass',this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-eye text-xs"></i></button></div>
        <button type="button" onclick="handleLogin()" class="btn-navy mt-2"><i class="fas fa-right-to-bracket"></i> LOG IN</button>
      </div>
      <div id="register-form" class="hidden space-y-3">
        <div class="relative"><input type="text" id="reg-name" placeholder="Full Name" class="inp pl-11"><i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i></div>
        <div class="relative"><input type="email" id="reg-email" placeholder="Email Address" class="inp pl-11"><i class="fas fa-envelope absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i></div>
        <div class="relative"><input type="number" id="reg-phone" placeholder="Phone Number" class="inp pl-11"><i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i></div>
        <div class="relative"><input type="password" id="reg-pass" placeholder="Password (6+ chars)" class="inp pl-11 pr-11"><i class="fas fa-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i><button type="button" onclick="togglePass('reg-pass',this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-eye text-xs"></i></button></div>
        <button type="button" onclick="handleRegister()" class="btn-pink mt-2"><i class="fas fa-user-plus"></i> CREATE ACCOUNT</button>
      </div>
    </div>
    <p class="text-center text-[10.5px] text-white/40 mt-6">© <span id="auth-footer-year"></span> SYL 3200 TOPUP · All Rights Reserved</p>
  </div>
</section>

<!-- আপনার বাকি সব HTML (app-content, sections, modals) এখানে বসান -->

</body>
</html>
